<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Kho Truyện - Ứng dụng đọc truyện tranh dọc offline. Tạo kho truyện riêng của bạn!">
  <title>Kho Truyện</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
  <div id="app">

    <!-- ==================== LIBRARY SCREEN ==================== -->
    <div id="screen-library" class="screen active">
      <div class="library-hero">
        <h1>📖 Kho Truyện</h1>
        <p>Bộ sưu tập truyện tranh của bạn</p>
        <div class="library-stats" id="library-stats">
          <div class="stat-badge"><span class="stat-num">0</span> truyện</div>
          <div class="stat-badge"><span class="stat-num">0</span> ảnh</div>
        </div>
      </div>

      <div class="search-container">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Tìm truyện...">
        </div>
      </div>

      <div class="story-grid" id="story-grid">
        <div class="empty-state">
          <div class="empty-icon">📚</div>
          <h3>Chưa có truyện nào</h3>
          <p>Nhấn nút + để tạo truyện mới<br>và bắt đầu bộ sưu tập của bạn!</p>
        </div>
      </div>

      <button class="fab" onclick="app.openCreate()" id="fab-create" aria-label="Tạo truyện mới">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- ==================== CREATE / EDIT SCREEN ==================== -->
    <div id="screen-create" class="screen">
      <div class="header">
        <button class="header-back" onclick="app.showScreen('library'); app.loadLibrary();" aria-label="Quay lại">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="header-title" id="create-title">Tạo truyện mới</span>
      </div>

      <div class="create-form">
        <div class="form-group">
          <label class="form-label" for="story-name-input">Tên truyện</label>
          <input type="text" class="form-input" id="story-name-input" placeholder="Nhập tên truyện...">
        </div>

        <div class="form-group">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <label class="form-label">Danh sách ảnh</label>
            <span class="form-label" id="image-count" style="color: var(--accent-light);">0 ảnh</span>
          </div>

          <div class="upload-area" id="upload-area">
            <div class="upload-icon">🖼️</div>
            <h3>Thêm ảnh vào truyện</h3>
            <p>Nhấn để chọn ảnh hoặc kéo thả vào đây</p>
          </div>

          <input type="file" id="file-input" accept="image/*" multiple hidden>

          <div class="image-list" id="image-list"></div>
        </div>
      </div>

      <div class="save-bar">
        <button class="btn btn-danger" id="delete-story-btn" style="display: none; flex: 0.4;" onclick="if(confirm('Bạn có chắc muốn xoá truyện này?')) app.deleteStory()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Xoá
        </button>
        <button class="btn btn-primary" onclick="app.saveStory()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Lưu truyện
        </button>
      </div>
    </div>

    <!-- ==================== READER SCREEN ==================== -->
    <div id="screen-reader" class="screen reader-screen">
      <div class="reader-progress" id="reader-progress"></div>

      <div class="reader-header" id="reader-header">
        <button class="header-back" onclick="app.exitReader()" aria-label="Thoát đọc truyện">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="header-title" id="reader-title">Tên truyện</span>
      </div>

      <div class="reader-content" id="reader-content">
        <!-- Images will be loaded here -->
      </div>

      <div class="reader-footer" id="reader-footer">
        <div class="reader-page-info">
          Trang <span id="reader-current">1</span> / <span id="reader-total">1</span>
        </div>
      </div>
    </div>

    <!-- ==================== STORY CONTEXT MENU MODAL ==================== -->
    <div class="modal-overlay" id="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-handle"></div>
        <div class="modal-title" id="modal-story-name">Tên truyện</div>
        <div class="modal-actions">
          <button class="modal-action-btn" onclick="app.menuRead()">
            <span class="action-icon">📖</span>
            Đọc truyện
          </button>
          <button class="modal-action-btn" onclick="app.menuEdit()">
            <span class="action-icon">✏️</span>
            Chỉnh sửa
          </button>
          <button class="modal-action-btn danger" onclick="app.menuDelete()">
            <span class="action-icon">🗑️</span>
            Xoá truyện
          </button>
          <button class="modal-action-btn" onclick="app.closeModal()" style="margin-top: 4px;">
            <span class="action-icon">✕</span>
            Đóng
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="./app.js"></script>
</body>
</html>
